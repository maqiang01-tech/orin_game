name: Game UI Tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "scenes/**"
      - "data/**"
      - "assets/images/ui/**"
      - "project.godot"
      - ".github/workflows/game-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-godot:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download verified Godot 4.7.2
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $target = Join-Path $env:RUNNER_TEMP 'godot'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $archive
          $expected = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          Expand-Archive $archive -DestinationPath $target
          "GODOT_EXE=$target/Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV

      - name: Import and run existing game checks with isolated saves
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force test-evidence | Out-Null
          function Run-GodotCheck([string]$Name, [string[]]$Arguments, [string]$SuccessMarker = '') {
            $env:APPDATA = Join-Path $env:RUNNER_TEMP "game-test-user/$Name/roaming"
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "game-test-user/$Name/local"
            New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
            $log = Join-Path 'test-evidence' "$Name.log"
            & $env:GODOT_EXE @Arguments 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "$Name exited with $LASTEXITCODE" }
            $text = Get-Content -Raw $log
            if ($text -match '(?m)^(SCRIPT ERROR:|ERROR:.*[Pp]arse|Parse Error:)') {
              throw "$Name reported a script error."
            }
            if ($SuccessMarker -and -not $text.Contains($SuccessMarker)) {
              throw "$Name did not report completion."
            }
          }
          Run-GodotCheck 'import' @('--headless', '--editor', '--path', '.', '--import')
          Run-GodotCheck 'integrity' @('--headless', '--path', '.', '--script', 'res://scripts/tools/verify_project_integrity.gd') 'PROJECT_INTEGRITY_PASS'
          Run-GodotCheck 'interactions' @('--headless', '--path', '.', '--script', 'res://scripts/tools/verify_ui_interactions.gd') 'UI interaction verification: PASS'

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-ui-evidence
          path: test-evidence/
